# Production stack on the Raspberry Pi. Lives at /srv/quire together with .env.
name: quire
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: quire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quire -d quire"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  app:
    image: ${QUIRE_IMAGE:-ghcr.io/ezragubbay/quire:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quire:${POSTGRES_PASSWORD}@db:5432/quire
      FILES_DIR: /data/files
      AUTH_MODE: ${AUTH_MODE:-github}
      AUTH_URL: ${AUTH_URL:-https://quire.ezragubbay.com}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      ALLOWED_GITHUB_LOGIN: ${ALLOWED_GITHUB_LOGIN:?set in .env}
      QUIRE_API_KEY: ${QUIRE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:3000:3000"

  cloudflared:
    # Enabled by COMPOSE_PROFILES=tunnel in .env once CF_TUNNEL_TOKEN is set.
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - app

  backup:
    image: ${QUIRE_BACKUP_IMAGE:-ghcr.io/ezragubbay/quire-backup:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: quire
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: quire
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-quire-backups}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
    volumes:
      - files:/data/files:ro
      - backups:/backups

volumes:
  pgdata:
  files:
  backups:
