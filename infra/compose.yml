# Production stack on the Raspberry Pi. Lives at /srv/quire together with .env.
name: quire
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: quire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quire -d quire"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  app:
    image: ${QUIRE_IMAGE:-ghcr.io/ezragubbay/quire:latest}
    restart: unless-stopped
    # On SIGTERM Next.js finishes in-flight requests and pending after() callbacks before exiting; Docker's
    # default 10 s can cut that short on deploy. https://nextjs.org/docs/app/guides/self-hosting#after
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quire:${POSTGRES_PASSWORD}@db:5432/quire
      FILES_DIR: /data/files
      AUTH_MODE: ${AUTH_MODE:-github}
      AUTH_URL: ${AUTH_URL:-https://quire.ezragubbay.com}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      ALLOWED_GITHUB_LOGIN: ${ALLOWED_GITHUB_LOGIN:?set in .env}
      QUIRE_API_KEY: ${QUIRE_API_KEY:-}
      # Research MCP connector key (/research/mcp only). Managed by deploy.yml from the QUIRE_RESEARCH_API_KEY secret.
      QUIRE_RESEARCH_API_KEY: ${QUIRE_RESEARCH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Claude generation routes (OpenAI still does embeddings + is the failover). Pick the route in Settings → AI.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # MCP upload tools (upload_markdown / upload_pdf). Set MCP_WRITE_ENABLED=false in .env to hide them.
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-true}
      # Same for the research server's write tools and upload links; independent of MCP_WRITE_ENABLED.
      MCP_RESEARCH_WRITE_ENABLED: ${MCP_RESEARCH_WRITE_ENABLED:-true}
      MCP_UPLOAD_LINK_TTL_MS: ${MCP_UPLOAD_LINK_TTL_MS:-600000}
      MCP_UPLOAD_LINK_MAX_OPEN: ${MCP_UPLOAD_LINK_MAX_OPEN:-50}
      MCP_UPLOAD_LINK_MAX_PDF_BYTES: ${MCP_UPLOAD_LINK_MAX_PDF_BYTES:-99614720}
      MCP_UPLOAD_LINK_MAX_MD_BYTES: ${MCP_UPLOAD_LINK_MAX_MD_BYTES:-2097152}
      MCP_UPLOAD_LINK_DEADLINE_MS: ${MCP_UPLOAD_LINK_DEADLINE_MS:-90000}
      MCP_UPLOAD_DEADLINE_MS: ${MCP_UPLOAD_DEADLINE_MS:-40000}
      MCP_UPLOAD_MAX_MARKDOWN_BYTES: ${MCP_UPLOAD_MAX_MARKDOWN_BYTES:-524288}
      DISABLE_AUTOUPDATER: '1'
      GOTENBERG_URL: http://gotenberg:3000
      # Firebase service-account JSON, base64 on one line; written into .env by deploy.yml. Empty = push disabled.
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${FCM_SERVICE_ACCOUNT_JSON_BASE64:-}
      # Drive inbox for the MCP import_from_drive tool: read-only service-account JSON (base64, one line) and the
      # "Quire Inbox" folder id; both written into .env by deploy.yml. Either empty = the Drive tools are not registered.
      DRIVE_SERVICE_ACCOUNT_JSON_BASE64: ${DRIVE_SERVICE_ACCOUNT_JSON_BASE64:-}
      QUIRE_DRIVE_INBOX_FOLDER_ID: ${QUIRE_DRIVE_INBOX_FOLDER_ID:-}
      DRIVE_IMPORT_MAX_PDF_BYTES: ${DRIVE_IMPORT_MAX_PDF_BYTES:-83886080}
      DRIVE_IMPORT_MAX_MD_BYTES: ${DRIVE_IMPORT_MAX_MD_BYTES:-2097152}
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:3000:3000"

  gotenberg:
    # Converts lecture decks (.pptx) to PDF and renders test PDFs. LibreOffice starts on first use and stops when
    # idle, so it costs little memory between conversions.
    image: ${QUIRE_GOTENBERG_IMAGE:-ghcr.io/ezragubbay/quire-gotenberg:latest}
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=240s
      - --libreoffice-auto-start=false
      - --libreoffice-idle-shutdown-timeout=5m
      - --libreoffice-restart-after=5

  cloudflared:
    # Enabled by COMPOSE_PROFILES=tunnel in .env once CF_TUNNEL_TOKEN is set.
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - app

  backup:
    image: ${QUIRE_BACKUP_IMAGE:-ghcr.io/ezragubbay/quire-backup:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: quire
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: quire
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-quire-backups}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
    volumes:
      - files:/data/files:ro
      - backups:/backups

volumes:
  pgdata:
  files:
  backups:
