<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts named in PowerPoint decks that are not installed here map to metric-compatible or close substitutes. -->
<fontconfig>
  <alias binding="same"><family>David</family><prefer><family>David CLM</family></prefer></alias>
  <alias binding="same"><family>Miriam</family><prefer><family>Miriam CLM</family></prefer></alias>
  <alias binding="same"><family>FrankRuehl</family><prefer><family>Frank Ruehl CLM</family></prefer></alias>
  <alias binding="same"><family>Narkisim</family><prefer><family>Nachlieli CLM</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Inconsolata</family></prefer></alias>
  <alias binding="same"><family>Rockwell</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Wingdings</family><prefer><family>Noto Sans Symbols</family></prefer></alias>
</fontconfig>
