# Local development: just Postgres with pgvector.
name: quire-dev
services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: quire
      POSTGRES_DB: quire
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
  # Optional: deck conversion and test PDFs locally. Set GOTENBERG_URL=http://localhost:3100 in apps/web/.env.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3100:3000"
    command:
      - gotenberg
      - --api-timeout=240s
      - --libreoffice-auto-start=false
volumes:
  pgdata-dev:
