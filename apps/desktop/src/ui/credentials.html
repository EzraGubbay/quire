<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>Lemida credentials</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1c1915;
        --panel: #262220;
        --line: #3a342f;
        --text: #efe9e1;
        --muted: #a89f93;
        --accent: #c9a227;
        --accent-ink: #1c1915;
        --ok: #7bbf6a;
        --warn: #d98c5f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 16px;
        color: var(--muted);
      }
      label {
        display: block;
        margin: 14px 0 5px;
        font-weight: 600;
      }
      .hint {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      input,
      textarea {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
      }
      textarea {
        resize: vertical;
        min-height: 46px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .preview {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        min-height: 18px;
      }
      .preview b {
        font: 600 15px/1 ui-monospace, monospace;
        letter-spacing: 0.1em;
        color: var(--text);
      }
      .actions {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        font: inherit;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        border-radius: 7px;
        padding: 9px 16px;
        cursor: pointer;
      }
      button.ghost {
        background: var(--panel);
        color: var(--text);
        border-color: var(--line);
      }
      #status {
        font-size: 12px;
        color: var(--muted);
      }
      #status.ok {
        color: var(--ok);
      }
      #status.warn {
        color: var(--warn);
      }
      .stored {
        color: var(--ok);
        font-size: 11px;
        font-weight: 400;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Lemida credentials</h1>
    <p class="sub">
      Stored encrypted in your macOS Keychain on this Mac only — never synced, uploaded, or sent to the server.
      Leave a field blank to keep what's already saved.
    </p>

    <label>Username / email <span class="stored hidden" id="u-stored">· saved</span></label>
    <input id="username" type="text" autocomplete="off" spellcheck="false" placeholder="you@biu.ac.il" />

    <label>Password <span class="stored hidden" id="p-stored">· saved</span></label>
    <input id="password" type="password" autocomplete="off" placeholder="••••••••" />

    <label>
      Authenticator setup key <span class="stored hidden" id="t-stored">· saved</span>
      <div class="hint">
        Base32 setup key or an <code>otpauth://</code> URI. In Microsoft Security info, add an authenticator →
        "different authenticator app" → "Can't scan image?" to reveal it. Your phone keeps working.
      </div>
    </label>
    <textarea id="totp" autocomplete="off" spellcheck="false" placeholder="JBSW Y3DP EHPK 3PXP"></textarea>
    <div class="preview" id="preview"></div>

    <div class="actions">
      <button type="button" id="save">Save</button>
      <span id="status"></span>
    </div>

    <script>
      const creds = window.lemidaCreds;
      const $ = (id) => document.getElementById(id);
      let previewTimer = null;

      async function loadStatus() {
        const s = await creds.status().catch(() => null);
        if (!s) return;
        if (!s.available) {
          setStatus("Keychain encryption unavailable — can't store credentials on this system.", "warn");
          $("save").disabled = true;
        }
        $("u-stored").classList.toggle("hidden", !s.hasUsername);
        $("p-stored").classList.toggle("hidden", !s.hasPassword);
        $("t-stored").classList.toggle("hidden", !s.hasTotp);
        if (s.hasUsername) $("username").placeholder = "•••••••• (saved)";
      }

      function setStatus(msg, cls) {
        const el = $("status");
        el.textContent = msg;
        el.className = cls || "";
      }

      async function updatePreview() {
        const secret = $("totp").value.trim();
        if (!secret) {
          $("preview").textContent = "";
          return;
        }
        const t = await creds.preview(secret).catch(() => null);
        $("preview").innerHTML = t
          ? `Current code: <b>${t.code.replace(/(\d{3})(\d{3})/, "$1 $2")}</b> · ${t.secondsRemaining}s left`
          : "Doesn't look like a valid key yet.";
      }

      $("totp").addEventListener("input", () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(updatePreview, 250);
      });

      $("save").onclick = async () => {
        const data = {
          username: $("username").value,
          password: $("password").value,
          totpSecret: $("totp").value,
        };
        const r = await creds.save(data).catch(() => ({ ok: false, reason: "error" }));
        if (r.ok) {
          setStatus("Saved.", "ok");
          $("password").value = "";
          $("totp").value = "";
          $("preview").textContent = "";
          loadStatus();
        } else {
          setStatus(`Couldn't save: ${r.reason || "unknown error"}`, "warn");
        }
      };

      loadStatus();
      // Keep the preview countdown ticking while a key is entered.
      setInterval(() => {
        if ($("totp").value.trim()) updatePreview();
      }, 1000);
    </script>
  </body>
</html>
