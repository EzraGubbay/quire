name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    name: Build and push image
    # Flip the repository variable DEPLOY_ENABLED to 'true' once the self-hosted runner is registered on the Pi.
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    # Native arm64 runner (free on public repos): no QEMU. The target platform is still linux/arm64, so gha cache
    # layers built under QEMU stay valid.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quire"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "backup=${image}-backup" >> "$GITHUB_OUTPUT"
          echo "gotenberg=${image}-gotenberg" >> "$GITHUB_OUTPUT"
          echo "tag=${image}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Gotenberg image (fonts for course decks)
        uses: docker/build-push-action@v6
        with:
          context: infra/gotenberg
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.gotenberg }}:${{ github.sha }}
            ${{ steps.meta.outputs.gotenberg }}:latest
          cache-from: type=gha,scope=gotenberg
          cache-to: type=gha,mode=max,scope=gotenberg
      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: infra/backup
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.backup }}:${{ github.sha }}
            ${{ steps.meta.outputs.backup }}:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
  deploy:
    name: Deploy on the Pi
    needs: image
    runs-on: [self-hosted, researchpi]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose file
        run: cp infra/compose.yml /srv/quire/compose.yml
      - name: Free disk before pull
        working-directory: /srv/quire
        # The Pi SD card runs near-full and the post-deploy prune only fires AFTER the pull, so a full disk used
        # to fail `docker compose pull` outright (no recreate, no rollback). Reclaim stale images and build cache
        # FIRST so the pull always has room. The currently running image is in use, so prune never removes it and
        # the rollback target stays intact.
        run: |
          set -uo pipefail
          echo "Disk before prune:"; df -h / | tail -1
          docker image prune -af --filter "until=168h" || true
          docker builder prune -af || true
          avail=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "Available after stale prune: ${avail:-unknown} KiB"
          # Still under ~3 GiB free? Drop ALL unused images (the running one is protected) to clear headroom.
          if [ "${avail:-0}" -lt 3145728 ]; then
            echo "Still low — pruning all unused images"
            docker image prune -af || true
          fi
          echo "Disk after prune:"; df -h / | tail -1
      - name: Sync FCM credential into .env
        working-directory: /srv/quire
        # Upserts (or removes, when the secret is empty) the single FCM_SERVICE_ACCOUNT_JSON_BASE64 line in .env.
        # The secret only ever travels through the environment and stdin: `printf` and `[[ ]]` are bash builtins,
        # so it never appears in a process's argv, and there is no `set -x`. A malformed value fails the step
        # without being echoed. The new file is built under umask 077 in the same directory, given .env's mode,
        # then renamed over .env atomically (a failed step never leaves .env truncated). Rotating the key = update
        # the Actions secret, then run this workflow by hand (workflow_dispatch); Compose recreates `app` because
        # its env changed.
        shell: bash
        env:
          FCM_B64: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -f .env || { echo "/srv/quire/.env missing (see infra/.env.example)"; exit 1; }
          value=$(printf '%s' "${FCM_B64:-}" | tr -d '\r\n ')
          if [[ -n "$value" && ! "$value" =~ ^[A-Za-z0-9+/_=-]+$ ]]; then
            echo "::error::FCM_SERVICE_ACCOUNT_JSON_BASE64 is not one-line base64 after stripping whitespace (value not shown)"
            exit 1
          fi
          umask 077
          tmp=$(mktemp .env.fcm.XXXXXX)
          trap 'rm -f "$tmp"' EXIT
          # grep exits 1 when it selects no lines (an .env holding only this key); only >1 is an error.
          grep -v '^FCM_SERVICE_ACCOUNT_JSON_BASE64=' < .env > "$tmp" || [ $? -eq 1 ]
          if [ -n "$value" ]; then
            printf 'FCM_SERVICE_ACCOUNT_JSON_BASE64=%s\n' "$value" >> "$tmp"
            echo "push: FCM credential written to .env"
          else
            echo "push disabled: no FCM credential"
          fi
          chmod --reference=.env "$tmp"
          mv -f "$tmp" .env
      - name: Sync Drive inbox credential into .env
        working-directory: /srv/quire
        # Same discipline as the FCM step above. Upserts (or removes, when empty) DRIVE_SERVICE_ACCOUNT_JSON_BASE64
        # (a secret: only ever in the environment and stdin, never argv or the log) and QUIRE_DRIVE_INBOX_FOLDER_ID
        # (a Drive id, not secret). A malformed value fails the step without being echoed. The new file is built
        # under umask 077, given .env's mode, then renamed over .env atomically. Rotating the key = update the
        # Actions secret, then run this workflow by hand (workflow_dispatch).
        shell: bash
        env:
          DRIVE_B64: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON_BASE64 }}
          DRIVE_FOLDER: ${{ vars.QUIRE_DRIVE_INBOX_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -f .env || { echo "/srv/quire/.env missing (see infra/.env.example)"; exit 1; }
          value=$(printf '%s' "${DRIVE_B64:-}" | tr -d '\r\n ')
          folder=$(printf '%s' "${DRIVE_FOLDER:-}" | tr -d '\r\n ')
          if [[ -n "$value" && ! "$value" =~ ^[A-Za-z0-9+/_=-]+$ ]]; then
            echo "::error::DRIVE_SERVICE_ACCOUNT_JSON_BASE64 is not one-line base64 after stripping whitespace (value not shown)"
            exit 1
          fi
          if [[ -n "$folder" && ! "$folder" =~ ^[A-Za-z0-9_-]{10,200}$ ]]; then
            echo "::error::QUIRE_DRIVE_INBOX_FOLDER_ID is not a Drive folder id (value not shown)"
            exit 1
          fi
          umask 077
          tmp=$(mktemp .env.drive.XXXXXX)
          trap 'rm -f "$tmp"' EXIT
          grep -v -e '^DRIVE_SERVICE_ACCOUNT_JSON_BASE64=' -e '^QUIRE_DRIVE_INBOX_FOLDER_ID=' < .env > "$tmp" || [ $? -eq 1 ]
          if [[ -n "$value" && -n "$folder" ]]; then
            printf 'DRIVE_SERVICE_ACCOUNT_JSON_BASE64=%s\n' "$value" >> "$tmp"
            printf 'QUIRE_DRIVE_INBOX_FOLDER_ID=%s\n' "$folder" >> "$tmp"
            echo "drive inbox: credential and folder id written to .env"
          else
            echo "drive inbox disabled: credential or folder id not set"
          fi
          chmod --reference=.env "$tmp"
          mv -f "$tmp" .env
      - name: Sync research MCP key into .env
        working-directory: /srv/quire
        # Same discipline as the FCM and Drive steps. Upserts (or removes, when the secret is empty) the single
        # QUIRE_RESEARCH_API_KEY line. The secret only ever travels through the environment and stdin (builtins
        # only, no `set -x`), so it never appears in argv or the log; a malformed value fails the step without
        # being echoed. The new file is built under umask 077, given .env's mode, then renamed over .env
        # atomically. Rotating = update the Actions secret, then run this workflow by hand.
        shell: bash
        env:
          RKEY: ${{ secrets.QUIRE_RESEARCH_API_KEY }}
        run: |
          set -euo pipefail
          test -f .env || { echo "/srv/quire/.env missing (see infra/.env.example)"; exit 1; }
          value=$(printf '%s' "${RKEY:-}" | tr -d '\r\n ')
          if [[ -n "$value" && ! "$value" =~ ^qk_r_[A-Za-z0-9_-]{40,}$ ]]; then
            echo "::error::QUIRE_RESEARCH_API_KEY is not a qk_r_ key of 40+ URL-safe characters (value not shown)"
            exit 1
          fi
          umask 077
          tmp=$(mktemp .env.rkey.XXXXXX)
          trap 'rm -f "$tmp"' EXIT
          grep -v '^QUIRE_RESEARCH_API_KEY=' < .env > "$tmp" || [ $? -eq 1 ]
          if [ -n "$value" ]; then
            printf 'QUIRE_RESEARCH_API_KEY=%s\n' "$value" >> "$tmp"
            echo "research MCP: key written to .env"
          else
            echo "research MCP disabled: no key"
          fi
          chmod --reference=.env "$tmp"
          mv -f "$tmp" .env
      - name: Pull, migrate, restart
        working-directory: /srv/quire
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          test -f .env || { echo "/srv/quire/.env missing (see infra/.env.example)"; exit 1; }
          prev=$(grep -E '^QUIRE_IMAGE=' .env | cut -d= -f2- || true)
          echo "$TAG" > .previous_image_candidate
          echo "${prev:-}" > .previous_image
          sed -i "s#^QUIRE_IMAGE=.*#QUIRE_IMAGE=${TAG}#" .env
          grep -q '^QUIRE_IMAGE=' .env || echo "QUIRE_IMAGE=${TAG}" >> .env
          docker compose pull app backup gotenberg
          docker compose up -d db
          docker compose up -d --remove-orphans
      - name: Health check
        working-directory: /srv/quire
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo healthy; exit 0; fi
            sleep 3
          done
          echo "app unhealthy, rolling back"
          prev=$(cat .previous_image)
          if [[ -n "$prev" ]]; then sed -i "s#^QUIRE_IMAGE=.*#QUIRE_IMAGE=${prev}#" .env; docker compose up -d app; fi
          docker compose logs --tail 100 app
          exit 1
      - name: Prune old images
        run: docker image prune -af --filter "until=168h" >/dev/null || true
