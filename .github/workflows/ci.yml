name: CI
on:
  pull_request:
  # Post-merge runs only when the lockfile changes: they write the main-scoped pnpm cache that PR runs restore from
  # (setup-node has no restore-keys), and give dependency bumps a post-merge signal. Other merges are covered by the
  # PR run: main is up-to-date-strict and the deploy builds the same tree.
  push:
    branches: [main]
    paths: ['pnpm-lock.yaml']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The apps/desktop workspace member depends on Electron; CI only lints/typechecks/builds it (never runs it),
# so skip the ~100 MB binary download on every install.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python client tests
        working-directory: clients/python
        run: pip install -q pytest && python -m pytest -q tests
  e2e:
    name: Build and e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: quire, POSTGRES_PASSWORD: quire, POSTGRES_DB: quire }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quire" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://quire:quire@localhost:5432/quire
      FILES_DIR: ${{ github.workspace }}/data/files
      AUTH_MODE: none
      AI_MOCK: '1'
      # Push without a credential: the fake transport records and logs instead of calling FCM.
      PUSH_TRANSPORT: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Push SQL store integration tests
        run: pnpm --filter web exec vitest run db.integration
        env:
          QUIRE_DB_TESTS: '1'
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: apps/web/test-results, retention-days: 7 }
  image-build:
    name: Image build (deploy parity)
    # Builds the deploy image's `build` stage exactly as infra/Dockerfile does (filtered `pnpm install --filter web...`
    # then `pnpm --filter web build`), on native amd64. The full-workspace install the other jobs use can type-check
    # against a wider lib than the image (#69/#70: a desktop-only transitive `type-fest@0.13.1` carries
    # `/// <reference lib="esnext"/>` into the web program via mermaid's phantom import), so only this job sees what
    # the deploy will see. Type and module-resolution errors don't depend on the CPU, so amd64 stands in for arm64.
    # PR-only: on push to main the Deploy workflow builds the real image anyway. No push, no gha cache (so the
    # deploy's cache scope is never touched).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image's build stage (amd64, not pushed)
        run: docker build --progress=plain --platform linux/amd64 --target build -f infra/Dockerfile .
